name: Build APK

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Cores libretro pré-compilados (nada é compilado aqui). Cache renovado toda semana
      # para pegar o nightly novo sem baixar ~50 MB a cada commit.
      - name: Semana (chave do cache dos cores)
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dos cores libretro
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/system
          key: libretro-cores-${{ hashFiles('scripts/fetch_cores.sh') }}-${{ steps.week.outputs.week }}

      - name: Baixar cores libretro
        run: bash scripts/fetch_cores.sh

      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Conferir se os cores entraram no APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -E 'lib/arm64-v8a/.*_libretro_android\.so' | tee cores.txt
          test "$(wc -l < cores.txt)" -ge 6 || { echo "Faltam cores no APK"; exit 1; }
          unzip -l "$apk" | grep -E 'assets/system/PPSSPP\.zip'
          ls -lh "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: nandox-arcade-debug
          path: app/build/outputs/apk/debug/app-debug.apk
